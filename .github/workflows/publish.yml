name: Publish to PyPI

# Trusted publishing: PyPI accepts the upload from this workflow file in the `pypi` environment
# through OpenID Connect, so no API token is stored in the repository.
#
# One-time setup: on PyPI, add a pending trusted publisher for the project name in pyproject.toml
# (owner BichengWang, repository multi-agents, workflow publish.yml, environment pypi).
#
# Release: bump `version` in pyproject.toml, run `uv lock`, merge, then publish a GitHub release
# tagged `v<version>`.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match v$version from pyproject.toml"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: |
          python -m pip install uv
          uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/multi-agent/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
