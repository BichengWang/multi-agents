name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light test dependencies
        run: pip install -r requirements-ci.txt
      - name: Run offline workflow tests
        run: python -m pytest tests/workflows -q
