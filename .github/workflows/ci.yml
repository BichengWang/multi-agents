name: CI

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Light deps only; the full project pulls in the training stack.
      - name: Install light test dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check agent tests
      - name: Run offline tests
        run: python -m pytest tests -q
