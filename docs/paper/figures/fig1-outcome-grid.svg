<title id="t">Outcome grid of the 48-task pilot</title>
<desc id="d">Forty-eight task columns grouped by repository and three rows (solo, review, best of 3). Filled squares are tasks resolved under both grading rules, squares with a white dot are resolved only under the current rule, outlined squares are unresolved. A fourth row gives the validity class letter of the 17 flagged tasks. Framed columns are the three tasks on which a team's outcome differs from solo's. Brackets mark the repositories with three or more tasks.</desc>
