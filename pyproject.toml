[project]
# PyPI rejects "multi-agents" as too similar to the existing "multiagents"; the command stays multi-agents.
name = "multi-agent"
version = "0.1.0"
description = "Multi-agent teams for real work: run teams of coding agents and measure them against solo agents"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BichengWang" }]
keywords = ["agents", "multi-agent", "coding-agents", "benchmark", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
]
dependencies = [
    "openai-agents==0.23.1",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
multi-agents = "agent.teams.cli:main"

[project.urls]
Homepage = "https://github.com/BichengWang/multi-agents"
Issues = "https://github.com/BichengWang/multi-agents/issues"

[project.optional-dependencies]
# Fresh-task benchmark (agent.bench): Modal sandboxes plus the public parquet dataset download.
bench = [
    "modal>=1.6,<2",
    "huggingface-hub>=0.30,<2",
    "pyarrow>=17",
]
# Any-model SDK agent: route the OpenAI Agents SDK through LiteLLM to other providers.
litellm = [
    "openai-agents[litellm]==0.23.1",
]
dev = [
    "pytest>=8.0.0",
    "ruff==0.15.8",
    # Parquet loader tests; the Modal and Hugging Face clients are faked offline.
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

# The sdist carries the package only; tests, docs, CI and plugin files live in the repository.
[tool.hatch.build.targets.sdist]
only-include = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the rule set so CI does not change when ruff's defaults do.
select = ["E4", "E7", "E9", "F"]
