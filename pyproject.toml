[project]
name = "multi-agents"
version = "0.1.0"
description = "Multi-agent workflows and evaluation"
requires-python = ">=3.10"
dependencies = [
    "openai-agents==0.23.1",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff==0.15.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the rule set so CI does not change when ruff's defaults do.
select = ["E4", "E7", "E9", "F"]
